[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnapy"
dynamic = ["version"]
description = "DNA plasmid editor for the GenBank format"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Martin Engqvist" }]
keywords = ["DNA", "plasmid", "GenBank", "sequence editor", "restriction enzymes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "wxPython>=4.2",
    "pycairo>=1.20",
    "PyPubSub>=4.0",
]

[project.urls]
Homepage = "https://github.com/MedziMatyas/DNApy"
Original = "https://github.com/mengqvist/DNApy"

[project.gui-scripts]
dnapy = "dnapy.gui.main:main"

[tool.setuptools.dynamic]
version = { attr = "dnapy.__version__" }

[tool.setuptools.packages.find]
include = ["dnapy*"]

[tool.setuptools.package-data]
dnapy = ["defaults/*.toml", "data/*.txt", "data/*.lst", "data/icons/*"]
